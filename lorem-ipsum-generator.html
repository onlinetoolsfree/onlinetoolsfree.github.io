    <body class="bg-light">
        <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
        <div class="container py-5">
            <div class="row">
                <div class="col-sm-8 bg-white">
                    <h1 class="text-center mb-4 py-3">💬 Lorem Ipsum Generator</h1>
                    <input id="paragraphCount" type="number" class="form-control mb-3" placeholder="Number of paragraphs" min="1" value="3">
                    <button class="btn btn-primary w-100 mb-3" onclick="generateLoremIpsum()">Generate</button>
                    <div id="ipsumOutput" class="bg-white p-3 border rounded shadow-sm"></div>
                </div>

                    <div class="sidebar" id="sidebar-container-page"></div>
                </div>
            </div>

        <script src="assets/js/footer-script.js"></script>
        <script>
            const ipsumWords = [
                "lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit", "sed", "do", "eiusmod",
                "tempor", "incididunt", "ut", "labore", "et", "dolore", "magna", "aliqua"
                ];

                function generateLoremIpsum() {
                const count = parseInt(document.getElementById("paragraphCount").value);
                const output = document.getElementById("ipsumOutput");
                output.innerHTML = "";

                for (let i = 0; i < count; i++) {
                    let paragraph = "<p>";
                    const wordCount = Math.floor(Math.random() * 30) + 20;
                    for (let j = 0; j < wordCount; j++) {
                    const word = ipsumWords[Math.floor(Math.random() * ipsumWords.length)];
                    paragraph += word + " ";
                    }
                    paragraph += "</p>";
                    output.innerHTML += paragraph;
                }
            }
        </script>
