  <body class="bg-light">
      <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
      <div class="container py-5">
        <div class="row">
              <div class="col-sm-8 bg-white">
                <h1 class="text-center mb-4 py-3">📅 Timestamp Converter</h1>
                <input id="timestampInput" class="form-control mb-3" placeholder="Enter Unix timestamp..." oninput="convertTimestamp()">
                <input id="dateOutput" class="form-control mb-3" readonly placeholder="Human-readable date">
                <input id="timestampOutput" class="form-control" readonly placeholder="Current timestamp (auto)">
                <small class="text-muted d-block text-end mt-1">Auto-updates every second</small>
              </div>
              <div class="col-sm-4">
                <div class="sidebar" id="sidebar-container-page"></div>
              </div>
        </div>
      </div>
      <footer class="footer text-white" id="footer-container"></footer>
      <script>
        function convertTimestamp() {
          const ts = parseInt(document.getElementById("timestampInput").value);
          if (!isNaN(ts)) {
            const date = new Date(ts * 1000);
            document.getElementById("dateOutput").value = date.toString();
          } else {
            document.getElementById("dateOutput").value = "";
          }
        }

        setInterval(() => {
          const now = Math.floor(Date.now() / 1000);
          document.getElementById("timestampOutput").value = now;
        }, 1000);
      </script>
