      <title>Text Character Counter</title>
      <style>
        p#charCount {
            font-weight: bold;
            font-size: 25px;
        }
      </style>

    <body class="bg-light">
        <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
        <div class="container py-5">
            <div class="row">                
                <div class="col-sm-8 bg-white">
                    <div class="col-12">
                        <h1 class="text-center mb-4 py-3">📏 Text Character Counter</h1>
                        <textarea id="textInput" class="form-control mb-2" rows="10" placeholder="Type something..." oninput="countCharacters()"></textarea>
                    </div>
                    <div class="col-12">
                        <p id="charCount" class="text-center m-0 p-2 btn-primary text-white">Characters: 0</p>
                    </div>
                </div>

                    <div class="sidebar" id="sidebar-container-page"></div>
                </div>
            </div>
        </div>
        <footer class="footer text-white" id="footer-container"></footer>
        <script>
            function countCharacters() {
            const input = document.getElementById("textInput").value;
            document.getElementById("charCount").textContent = "Characters: " + input.length;
            }
        </script>
        <script src="assets/js/footer-script.js"></script>
