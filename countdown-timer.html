      <title>Countdown Timer</title>
    </head>
  <body class="bg-light">
      <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
      <div class="container py-5">
        <div class="row">
          <!-- Timer Section -->
          <div class="col-sm-8">
            <h1 class="text-center mb-4 py-3">⏰ Countdown Timer</h1>
            <div class="input-group mb-3">
              <input
                id="timerMinutes"
                type="number"
                class="form-control"
                placeholder="Enter minutes"
                min="1"
              />
              <button class="btn btn-primary" onclick="startTimer()">Start</button>
            </div>
            <h3 id="timerDisplay" class="text-center display-4">00:00</h3>
          </div>

          <!-- Sidebar Section -->
          <div class="col-sm-4">
            <div class="sidebar" id="sidebar-container-page">
              <!-- Add your sidebar content here -->
            </div>
          </div>
        </div>
      </div>

      <script>
        let countdown;

        function startTimer() {
          clearInterval(countdown); // Clear any existing timer
          const minutes = parseInt(document.getElementById("timerMinutes").value);
          if (isNaN(minutes) || minutes < 1) {
            alert("Please enter a valid number of minutes.");
            return;
          }

          let seconds = minutes * 60;
          const display = document.getElementById("timerDisplay");

          countdown = setInterval(() => {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            display.textContent = `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
            if (seconds <= 0) {
              clearInterval(countdown);
              alert("⏰ Time's up!");
            }
            seconds--;
          }, 1000);
        }
      </script>
