      <title>Image Resizer</title>
    </head>
  <body class="bg-light">
      <div class="bg-light nav-bg sticky-top" id="navbar-container"></div>
      <div class="container py-5">
          <div class="row">
            <div class="col-sm-8 bg-white">
                  <h1 class="text-center mb-4">📷 Image Resizer (Client-side)</h1>
                  <input type="file" accept="image/*" class="form-control mb-3" onchange="previewAndResize(event)">
                  <select id="sizeOptions" class="form-control mb-3">
                    <option value="100">1200x630</option>
                    <option value="200">200x200</option>
                    <option value="300" selected>300x300</option>
                  </select>
                  <canvas id="resizedCanvas" class="w-100 border rounded shadow-sm my-3" style="max-height: 300px;"></canvas>
                  <a id="downloadLink" class="btn btn-primary d-none" download="resized.jpg" href="#">Download Resized Image</a>
              </div>
                <div class="col-sm-4">
                    <div class="sidebar" id="sidebar-container-page"></div>
                </div>
          </div>
      </div>
      <footer class="footer text-white" id="footer-container"></footer>
      <script src="assets/js/footer-script.js"></script>
      <script>
        let currentImg = null;
        let currentCanvas = null;

        function resizeImage() {
          if (!currentImg || !currentCanvas) return;

          const MAX_SIZE = parseInt(document.getElementById("sizeOptions").value);
          const img = currentImg;
          const canvas = currentCanvas;
          const ctx = canvas.getContext("2d");

          // Calculate new dimensions using original image size
          let width = img.naturalWidth;
          let height = img.naturalHeight;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          // Update download link
          const downloadLink = document.getElementById("downloadLink");
          downloadLink.href = canvas.toDataURL("image/jpeg");
          downloadLink.classList.remove("d-none");
          // Add download filename
          downloadLink.download = "resized-image.jpg";
        }

        function previewAndResize(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
              currentCanvas = document.getElementById("resizedCanvas");
              currentImg = img;

              resizeImage();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }

        // Add event listener for size selection
        document.getElementById('sizeOptions').addEventListener('change', function() {
          if (currentImg && currentCanvas) {
            resizeImage();
          }
        });
      </script>
  </body>
